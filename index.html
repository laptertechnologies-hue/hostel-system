<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Hub - Find Your Next Home</title>
    <meta name="description" content="Find affordable, safe, and high-quality student hostels near your university. Browse listings, view room details, and book your stay online with Hostel Hub.">
    <meta name="keywords" content="student hostels, university accommodation, student housing, hostel hub, book hostel online, cheap student rooms">
    <link rel="canonical" href="https://hostel-hub.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hostel Hub - Find Your Next Home">
    <meta property="og:description" content="The ultimate platform for student accommodation. Find the perfect hostel near your campus today.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=1200&q=80">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .hero-section { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=1350&q=80'); background-size: cover; color: white; padding: 100px 0; }
        .hostel-card:hover { transform: translateY(-5px); transition: 0.3s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 0.8s ease-out forwards; }
        .hero-section h1 { opacity: 0; }
        .hero-section p { opacity: 0; }
        .hero-section .input-group { opacity: 0; }
        .animate-item { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    <line x1="12" y1="2" x2="12" y2="7"></line>
                </svg>
                HOSTEL HUB
            </a>
            <div class="d-flex align-items-center" id="navAuthSection">
                <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="login.html?tab=signup" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="flex-shrink-0">
        <header class="hero-section text-center">
            <div class="container">
                <h1 class="display-4 fw-bold animate-up" style="animation-delay: 0.2s">Find Your Perfect Student Home</h1>
                <p class="lead animate-up" style="animation-delay: 0.4s">Browse available rooms, compare prices, and book per semester.</p>
            </div>
        </header>

        <div class="container my-5">
            <h2 class="mb-4 text-center">Available Rooms</h2>
            <section id="hostelList" class="row g-4">
                <!-- Hostels injected here -->
            </section>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2023 Hostel Hub. Built with Supabase & Bootstrap.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await supabaseClient.auth.getSession();
            if (session.data.session) {
                document.getElementById('navAuthSection').innerHTML = `
                    <span class="me-3">Hi, ${session.data.session.user.user_metadata.name || 'User'}</span>
                    <button class="btn btn-outline-danger btn-sm" onclick="signOut()">Logout</button>
                `;
            }

            fetchHostels();
        });
    </script>
</body>
</html>
