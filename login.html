<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Hostel Hub</title>
    <meta name="description" content="Sign in or register for Hostel Hub to manage your student accommodation bookings.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .auth-card { max-width: 400px; width: 100%; margin: auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            animation: slideIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="text-primary mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <h2 class="fw-bold text-primary">Hostel Hub</h2>
            <p class="text-muted">Sign in to book your room</p>
        </div>

        <button onclick="signInWithGoogle()" class="btn btn-outline-dark w-100 mb-3 d-flex align-items-center justify-content-center">
            <img src="https://www.google.com/favicon.ico" width="18" class="me-2"> Continue with Google
        </button>

        <div class="text-center mb-3">
            <hr class="text-muted">
            <span class="bg-white px-2 text-muted small" style="position:relative; top:-25px;">OR</span>
        </div>

        <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
            <li class="nav-item w-50"><button class="nav-link active w-100" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button></li>
            <li class="nav-item w-50"><button class="nav-link w-100" data-bs-toggle="tab" data-bs-target="#signupTab">Register</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="loginTab">
                <form id="loginForm">
                    <div class="mb-3"><input type="email" id="loginEmail" class="form-control" placeholder="Email" required></div>
                    <div class="mb-3"><input type="password" id="loginPassword" class="form-control" placeholder="Password" required></div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
            <div class="tab-pane fade" id="signupTab">
                <form id="signupForm">
                    <div class="mb-3"><input type="text" id="signupName" class="form-control" placeholder="Full Name" required></div>
                    <div class="mb-2"><input type="email" id="signupEmail" class="form-control" placeholder="Email" required></div>
                    <div class="mb-2"><input type="text" id="signupUniversity" class="form-control" placeholder="University"></div>
                    <div class="mb-3"><input type="password" id="signupPassword" class="form-control" placeholder="Password" required></div>
                    <button type="submit" class="btn btn-success w-100">Create Account</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small">← Back to home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
        document.getElementById('signupForm')?.addEventListener('submit', handleSignUp);
        
        // Simple tab switcher logic for the 'signup' query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'signup') {
            new bootstrap.Tab(document.querySelector('[data-bs-target="#signupTab"]')).show();
        }
    </script>
</body>
</html>
