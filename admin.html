<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hostel Hub</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .stat-card { animation: slideUp 0.5s ease-out forwards; opacity: 0; }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .animate-item { opacity: 0; animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Admin Panel</a>
            <button class="btn btn-outline-light btn-sm" onclick="signOut()">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row g-3 mb-4">
            <div class="col-md-4 stat-card">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Total Hostels</h6>
                    <h2 id="statHostels" class="fw-bold text-primary">0</h2>
                </div>
            </div>
            <div class="col-md-4 stat-card">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Registered Users</h6>
                    <h2 id="statUsers" class="fw-bold text-success">0</h2>
                </div>
            </div>
            <div class="col-md-4 stat-card">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Total Bookings</h6>
                    <h2 id="statBookings" class="fw-bold text-warning">0</h2>
                </div>
            </div>
        </div>

        <h5 class="mb-3">User Management</h5>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody id="adminUserList">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 mt-5">
            <h5 class="mb-0">Hostel Management</h5>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addHostelModal">
                <i class="bi bi-plus-lg"></i> Add New Hostel
            </button>
        </div>

        <div class="card border-0 shadow-sm mb-5">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Location</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminHostelList">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Hostel Modal -->
    <div class="modal fade" id="addHostelModal" tabindex="-1">
        <div class="modal-dialog">
            <form id="addHostelForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Hostel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Hostel Name</label>
                        <input type="text" id="hName" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col"><label class="form-label">Location</label><input type="text" id="hLocation" class="form-control" required></div>
                        <div class="col"><label class="form-label">Price (Monthly)</label><input type="number" id="hPrice" class="form-control" required></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Target University</label>
                        <input type="text" id="hUniversity" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="url" id="hImage" class="form-control" placeholder="https://...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="hDescription" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Hostel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('addHostelForm')?.addEventListener('submit', handleCreateHostel);
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await checkAdminSession();
            if (session) {
                fetchAdminStats();
                fetchAllProfiles();
                fetchAdminHostels();
            }
        });
    </script>
</body>
</html>
